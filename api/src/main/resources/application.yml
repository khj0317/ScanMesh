spring:
  application:
    name: scanmesh-api
  # 로컬은 docker-compose의 Postgres(5434), 배포는 환경 변수로 Supabase에 연결한다
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/scanmesh}
    username: ${DB_USERNAME:scanmesh}
    password: ${DB_PASSWORD:scanmesh}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션으로만 바꾸고, Hibernate는 엔티티와 맞는지만 확인한다
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  # StoreFit(8080), FitMate(8081·8082)와 겹치지 않게 8090을 쓴다
  port: ${PORT:8090}
  # Render 같은 프록시 뒤에서 https 주소를 올바르게 인식한다
  forward-headers-strategy: native

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  # 개발용 기본값. 배포(prod 프로필)에서는 JWT_SECRET이 없으면 서버가 뜨지 않는다
  secret: ${JWT_SECRET:dev-only-secret-key-change-this-before-deploying-1234567890}
  access-token-validity: ${JWT_ACCESS_VALIDITY:30m}
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:14d}

app:
  # 여러 개면 쉼표로 구분, * 패턴 가능 (예: https://scanmesh-*.vercel.app)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180}

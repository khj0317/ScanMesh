spring:
  application:
    name: scanmesh-worker
  main:
    # 워커는 API를 열지 않고, 먼저 API 서버에 접속해 작업을 가져간다
    web-application-type: none
  threads:
    virtual:
      enabled: true

worker:
  api-url: ${WORKER_API_URL:http://localhost:8090}
  token: ${WORKER_TOKEN:}
  kind: ${WORKER_KIND:LIGHT}
  poll-interval: ${WORKER_POLL_INTERVAL:10s}
  # 내부 주소여도 점검하는 개발용 호스트. API의 DEV_ALLOWED_HOSTS와 같은 값을 넣는다
  dev-allowed-hosts: ${DEV_ALLOWED_HOSTS:}

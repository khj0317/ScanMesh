# Render 블루프린트: API 서버(Docker). 값이 없는(sync: false) 환경 변수는 처음 만들 때 Render 화면에서 넣는다.
# 배포 순서와 값은 docs/deploy.md에 있다
services:
  - type: web
    name: scanmesh-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # 화면이나 워커만 바뀐 커밋에는 API를 다시 배포하지 않는다
    buildFilter:
      paths:
        - api/**
        - common/**
        - build.gradle
        - settings.gradle
        - gradle/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Render가 처음 한 번 무작위 값을 만들어 둔다
      - key: JWT_SECRET
        generateValue: true
      # Supabase 세션 풀러 주소 (Render는 IPv4만 쓰므로 IPv6 전용인 직접 연결 주소는 쓸 수 없다)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Supabase 무료 플랜의 연결 수 제한 안에서 쓴다
      - key: DB_POOL_SIZE
        value: "5"
      # Vercel 화면 주소 (예: https://scanmesh.vercel.app)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
